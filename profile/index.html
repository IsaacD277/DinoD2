  <link rel="stylesheet" href="/src/style/popups.css" />

  <link rel="stylesheet" href="profile.css" />

<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="logo">DinoD2</h1>
    </div>

    <div class="pages">
      <button id="newslettersBtn" class="navigation">Newsletters</button>
      <button id="subscribersBtn" class="navigation">Subscribers</button>
    </div>

    <div class="topbar-right dropdown">
      <span class="material-symbols-outlined">account_circle</span>
      <div id="myDropdown" class="dropdown-content">
        <a id="profileBtn">Settings</a>
        <a id="logoutBtn" class="delete">Logout</a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1 id="pageTitle">Settings</h1>
    <div>
      <form id="profileForm">
        <!-- Editable Fields -->
        <label>
          Your Name:
          <input type="text" id="owner" name="owner" placeholder="John Doe">
        </label>

        <label>
          Business Address (Legally Required):
          <input type="text" id="businessAddress" name="businessAddress" placeholder="123 Main St, City, State">
        </label>

        <label>
          Reply-To Email Address:
          <input type="text" id="replyToEmail" name="replyToEmail" placeholder="reply@example.com">
        </label>

        <!-- Read-only Information -->
        <div class="readonly-section">
          <h2>Account Information (View Only)</h2>

          <label>
            Your Email Address:
            <input type="email" id="ownerEmail" name="ownerEmail" readonly>
          </label>

          <label>
            Send Emails From:
            <input type="text" id="senderEmail" name="senderEmail" placeholder="newsletter" readonly>
            <p>@dinod2.com</p>
          </label>

          <label>
            Joined:
            <input type="text" id="createdAt" name="joined" readonly>
          </label>

          <label>
            Max Subscribers:
            <input type="text" id="maxSubscribers" name="maxSubscribers" readonly>
          </label>

          <label>
            Plan:
            <input type="text" id="plan" name="plan" readonly>
          </label>
        </div>

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <div id="snackbar"></div>

  <script src="/src/utilities/authentication.js"></script>
  <script src="/src/utilities/popups.js"></script>
  <script src="profile.js"></script>
</body>

</html>
