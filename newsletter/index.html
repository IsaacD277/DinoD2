</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="logo">DinoD2</h1>
    </div>

    <div>
      <button id="newslettersBtn" class="navigation">Newsletters</button>
      <button id="subscribersBtn" class="navigation">Subscribers</button>
      <button id="profileBtn" class="navigation">Profile</button>
    </div>
    
    <div class="topbar-right">
      <button id="logoutBtn" class="authentication" title="Logout">Logout</button>
    </div>
  </header>
    <div class="container">
        <div class="heading">
          <div>
            <p id="saveStatus">Saved</p>
            <i class="fa fa-pencil" id="editPencil"></i>
            <h1 class="horizontal">Subject: </h1>
            <h1 class="horizontal" id="pageTitle" contenteditable></h1>
          </div>
          <div class="dropdown">
              <button id="newsletterOptions" class="dropbtn">More</button>
              <div id="myDropdown" class="dropdown-content">
                <a id="sendToOne">Send to Individual</a>
                <a id="sendToEveryone" class="tooltip">Send to All Subscribers
                  <span id="alreadySent" class="tooltiptext">This will send the newsletter to all of your subscribers</span>
                </a>
                <a id="deleteNewsletter" class="deleteNewsletter">Delete</a>
              </div>
          </div>
        </div>

        <trix-toolbar id="myToolbar"></trix-toolbar>
        <iframe id="livePreviewTest" name="previewTest" style="width: 100%; height: 75vh; border: 2px solid #e2e8f0; border-radius: 0 0 8px 8px;" title="Email Preview Test" src="livePreviewTest.html"></iframe>
        <input id="content" type="hidden" name="content">
        <trix-editor toolbar="myToolbar" input="content" style="display: none;"></trix-editor>

        <div id="snackbar"></div>
    </div>
  <div id="singleSendModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <label>
        Choose Subscriber:
        <select id="subscriberListDropdown">
          <option value="">Loading...</option>
        </select>
      </label>

      <button id="submitSend" class="modal-button" type="submit">Send</button>
    </div>
  </div>

  <script src="/src/utilities/authentication.js"></script>
  <script src="/src/utilities/popups.js"></script>
  <script src="newsletter.js"></script>
</body>
</html>
