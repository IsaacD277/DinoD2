<html>
<head>
  <title>Newsletter Editor</title>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="https://unpkg.com/trix@2.0.8/dist/trix.css">
  <script type="text/javascript" src="https://unpkg.com/trix@2.0.8/dist/trix.umd.min.js"></script>
  <link rel="stylesheet" href="/style/topbar.css" />
  <link rel="stylesheet" href="newsletter.css" />

</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="logo">DinoD2</h1>
    </div>

    <div>
      <button id="newslettersBtn" class="navigation">Newsletters</button>
      <button id="subscribersBtn" class="navigation">Subscribers</button>
      <button id="profileBtn" class="navigation">Profile</button>
    </div>
    
    <div class="topbar-right">
      <button id="logoutBtn" class="authentication" title="Logout">Logout</button>
    </div>
  </header>
  
  <div class="container">
    <div class="heading">
      <h1 id="pageTitle">Newsletter Editor</h1>
      <div class="dropdown">
        <button id="newsletterOptions" class="dropbtn">More</button>
        <div id="myDropdown" class="dropdown-content">
          <a id="changeSend">Change Send Date</a>
          <a id="previewNewsletter">Preview Newsletter</a>
          <a id="sendToEveryone">Send to All Subscribers</a>
        </div>
      </div>
    </div>

    <div class="stats">
      <p>Sends: <span id="sendCount">0</span></p>
      <p>Open Rate: <span id="openRate">0%</span></p>
    </div>

    <form id="newsletterForm">
      <label>
        Subject:
        <input type="text" id="subject" name="subject" placeholder="Enter newsletter subject" required>
      </label>

      <label>
        Preview Text:
        <input type="text" id="preview" name="preview" placeholder="Short preview text that appears in email clients">
      </label>

      <label for="content">Newsletter Content:</label>
      <input id="content" type="hidden" name="content">
      <trix-editor input="content"></trix-editor>

      <button type="submit">Save Newsletter</button>
    </form>

    <div class="action-buttons">
      <button id="backBtn">← Back to Newsletters</button>
    </div>

    <div id="snackbar"></div>
  </div>

  <div id="sendDateModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <label>
        Send Date:
        <input type="date" id="sendDate" name="sendDate" class="third-width">
      </label>
      <button id="submitDate" class="modal-button" type="submit">Submit</button>
    </div>
  </div>

  <script src="/authentication.js"></script>
  <script src="newsletter.js"></script>
</body>
</html>
