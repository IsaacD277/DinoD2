<html>

<head>
  <title>DinoD2</title>
  <meta charset="UTF-8">

  <link rel="stylesheet" type="text/css" href="https://unpkg.com/trix@2.0.8/dist/trix.css">
  <script type="text/javascript" src="https://unpkg.com/trix@2.0.8/dist/trix.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/src/style/topbar.css" />
  <link rel="stylesheet" href="/src/style/popups.css" />
  <link rel="stylesheet" href="/src/style/elements.css" />
  <link rel="stylesheet" href="/index.css" />
  <link rel="stylesheet" href="newsletter.css" />

        api_host: 'https://t.dinod2.com',

  <script>
    document.addEventListener("trix-before-initialize", () => {
      Trix.config.blockAttributes.heading1.tagName = 'h2';
    });
  </script>
</head>

<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="logo">DinoD2</h1>
    </div>

    <div class="pages">
      <button id="newslettersBtn" class="navigation">Newsletters</button>
      <button id="subscribersBtn" class="navigation">Subscribers</button>
    </div>

    <div class="topbar-right dropdown">
      <span class="material-symbols-outlined">account_circle</span>
      <div id="myDropdown" class="dropdown-content">
        <a id="profileBtn">Settings</a>
        <a id="logoutBtn" class="delete">Logout</a>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="heading">
      <div>
        <p id="saveStatus">Saved</p>
        <i class="fa fa-pencil" id="editPencil"></i>
        <h1 class="horizontal">Subject: </h1>
        <h1 class="horizontal" id="pageTitle" contenteditable></h1>
        <div>
          <i class="fa fa-pencil" id="editPencilPreview"></i>
          <p class="horizontal" id="previewMessage">Preview: </p>
          <p class="horizontal" id="previewMessageEdit" contenteditable></p>
        </div>
      </div>
      <div class="dropdown">
        <button id="newsletterOptions" class="dropbtn">More</button>
        <div id="myDropdown" class="dropdown-content">
          <a id="sendToOne">Send to Individual</a>
          <a id="sendToEveryone" class="tooltip">Send to All Subscribers
            <span id="alreadySent" class="tooltiptext">This will send the newsletter to all of your subscribers</span>
          </a>
          <a id="deleteNewsletter" class="deleteNewsletter">Delete</a>
        </div>
      </div>
    </div>

    <iframe id="newsletterEditor" name="newsletterEditor"
      style="width: 100%; height: 75vh; border: 2px solid #e2e8f0; border-radius: 10px;" title="Email Preview Test"
      src="livePreviewTest.html"></iframe>

    <div id="snackbar"></div>
  </div>
  <div id="singleSendModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <label>
        Choose Subscriber:
        <select id="subscriberListDropdown">
          <option value="">Loading...</option>
        </select>
      </label>

      <button id="submitSend" class="modal-button" type="submit">Send</button>
    </div>
  </div>

  <script src="/src/utilities/authentication.js"></script>
  <script src="/src/utilities/popups.js"></script>
  <script src="newsletter.js"></script>
</body>

</html>
