<html>
<head>
  <title>Newsletter Editor</title>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Trix Editor for rich text content -->
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/trix@2.0.8/dist/trix.css">
  <script type="text/javascript" src="https://unpkg.com/trix@2.0.8/dist/trix.umd.min.js"></script>
  <link rel="stylesheet" href="/src/style/topbar.css" />
  <link rel="stylesheet" href="/src/style/popups.css" />
  <link rel="stylesheet" href="newsletter.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.0/split.min.js"></script>

</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="logo">DinoD2</h1>
    </div>

    <div>
      <button id="newslettersBtn" class="navigation">Newsletters</button>
      <button id="subscribersBtn" class="navigation">Subscribers</button>
      <button id="profileBtn" class="navigation">Profile</button>
    </div>
    
    <div class="topbar-right">
      <button id="logoutBtn" class="authentication" title="Logout">Logout</button>
    </div>
  </header>
  
      <div class="split">
        <div id="split-0">
            <div class="container">
                <div class="heading">
                  <h1 id="pageTitle">Newsletter Editor</h1>
                  <div class="dropdown">
                      <button id="newsletterOptions" class="dropbtn">More</button>
                      <div id="myDropdown" class="dropdown-content">
                        <a id="changeSettings">Change Settings</a>
                        <a id="previewNewsletter">Preview Newsletter</a>
                        <a id="livePreviewNewsletter">Show Live Preview</a>
                        <a id="sendToOne">Send to Individual</a>
                        <a id="sendToEveryone">Send to All Subscribers</a>
                        <a id="deleteNewsletter" class="deleteNewsletter">Delete</a>
                      </div>
                  </div>
                </div>

                <div id="newsletterStats" class="stats">
                  <p>Sends: <span id="sendCount">0</span></p>
                  <p>Open Rate: <span id="openRate">0%</span></p>
                </div>

                <form id="newsletterForm">
                  <label id="formSubject">
                      Subject:
                      <input type="text" id="subject" name="subject" placeholder="Enter newsletter subject" required>
                  </label>

                  <label id="formPreview">
                      Preview Text:
                      <input type="text" id="preview" name="preview" placeholder="Short preview text that appears in email clients">
                  </label>

                  <label for="content">Newsletter Content:</label>
                  <input id="content" type="hidden" name="content">
                  <trix-editor input="content"></trix-editor>

                  <button type="submit">Save Newsletter</button>
                </form>

                <div class="action-buttons">
                <button id="backBtn">← Back to Newsletters</button>
                </div>

                <div id="snackbar"></div>
            </div>
        </div>
        <div id="split-1">
            <div id="previewContainer">
                <iframe id="livePreview" name="preview" style="border:2px solid red; border-radius: 20px; width: 100%;" title="Email Preview" src="livePreview.html"></iframe>
            </div>
        </div>
    </div>

  <div id="newsletterSettingsModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <label>
        Send Date:
        <input type="date" id="sendDate" name="sendDate" class="third-width">
      </label>

      <label>
        Template:
        <select id="newsletterTemplateDropdown">
          <option value="">Loading...</option>
        </select>
      </label>

      <div id="forKesla">
        <label>
          Background Image:
          <input type="file" id="backgroundImage" name="filename">
        </label>

        <label>
          Box Background Color: <br>
          <input type="color" id="backgroundColor" name="backgroundColor" value="#240b0b" alpha>
        </label>
      </div>
      <button id="submitSettings" class="modal-button" type="submit">Submit</button>
    </div>
  </div>

  <div id="singleSendModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <label>
        Choose Subscriber:
        <select id="subscriberListDropdown">
          <option value="">Loading...</option>
        </select>
      </label>

      <button id="submitSend" class="modal-button" type="submit">Send</button>
    </div>
  </div>

  <script src="/src/utilities/authentication.js"></script>
  <script src="/src/utilities/popups.js"></script>
  <script src="newsletter.js"></script>
</body>
</html>
